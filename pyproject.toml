[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge-sba"
version = "0.1.0"
description = "A local-first data science learning toolkit and notebook generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "nbformat>=5.9"]

[project.optional-dependencies]
dashboard = ["Flask>=3.0", "plotly>=5.18", "openpyxl>=3.1"]
visualization = ["matplotlib>=3.7", "seaborn>=0.13", "plotly>=5.18"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "build>=1.0"]

[project.scripts]
dataforge-sba = "dataforge_sba.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataforge_sba = ["dashboard/templates/*.html", "dashboard/static/css/*.css", "dashboard/static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
